modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ChinaEX123"
logoFile="logo.png"
description='''
Add more features to the brush.
'''

[[mixins]]
config="${mod_id}.mixins.json"


[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId = "kubejs"
    type = "optional"
    versionRange = "[2101.7.2-build.309,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "jei"
    type = "optional"
    versionRange = "[19.21.1.304,)"
    ordering = "NONE"
    side = "BOTH"
